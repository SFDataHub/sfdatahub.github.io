<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SF Data Hub</title>

    <script>
      window.goatcounter = window.goatcounter || {};
      window.goatcounter.no_onload = true;
    </script>
    <script
      data-goatcounter="https://sfdatahub.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>

    <!-- PWA: Manifest + Farben -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0C1C2E" />

    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Guard: erzwinge Root-SW und verhindere relative Registrierungen -->
    <script>
      if ('serviceWorker' in navigator) {
        const orig = navigator.serviceWorker.register.bind(navigator.serviceWorker);
        navigator.serviceWorker.register = (_url, opts = {}) =>
          orig('/service-worker.js', { ...opts, scope: '/' });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Deine App -->
    <script type="module" src="/src/appBootstrap.ts"></script>

  </body>
</html>
